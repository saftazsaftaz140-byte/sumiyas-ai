<!DOCTYPE html>
<html lang="mn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sumiya’s AI</title>
<style>
:root{--bg:#000;--bg2:#0e1a4a;--surface:#1b1b1f;--card:#26262b;--text:#ececf1;--muted:#9a9aa5;--accent:#4a63ff;--border:#2e2e36;--me:#2b3a8f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f7fb;--bg2:#dfe6ff;--surface:#fff;--card:#eef0f7;--text:#1b1c22;--muted:#6b6d7a;--border:#dcdfea;--me:#dfe5ff}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#f6f7fb;--bg2:#dfe6ff;--surface:#fff;--card:#eef0f7;--text:#1b1c22;--muted:#6b6d7a;--border:#dcdfea;--me:#dfe5ff}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--bg) 45%,var(--bg2));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:6px;padding:10px 12px}
.ib{background:none;border:0;font-size:22px;width:42px;height:42px;border-radius:50%}
.top h1{font-size:18px;font-weight:400;margin:0;flex:1}
.av{width:38px;height:38px;border-radius:50%;background:#c4421a;color:#fff;border:0;font-weight:600;font-size:17px;overflow:hidden;padding:0}
.av img{width:100%;height:100%;object-fit:cover}
main{flex:1;overflow-y:auto;position:relative;display:flex;flex-direction:column}
#home{margin:auto 0;padding:0 24px 30px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:0 0 30px #4a63ff55}
.brand{font-size:15px;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
#home h2{font-size:30px;font-weight:400;margin:6px 0 26px}
.sug{width:100%;max-width:420px;display:flex;flex-direction:column;gap:4px}
.sug button{background:none;border:0;display:flex;gap:16px;align-items:center;text-align:left;padding:12px 6px;font-size:16px}
.sug span{font-size:20px;width:28px;text-align:center}
#chat{padding:8px 14px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%;padding:10px 14px;border-radius:20px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.me{background:var(--me);align-self:flex-end;border-bottom-right-radius:6px}
.bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:6px}
.msg img{display:block;width:100%;max-width:340px;border-radius:14px;background:#fff;margin-top:6px}
.act{display:flex;gap:4px;margin-top:6px}
.act button{background:var(--card);border:0;border-radius:10px;padding:4px 9px;font-size:14px}
.bar{padding:8px 12px 12px}
#pv{display:inline-block;background:var(--card);border-radius:12px;padding:6px 10px;font-size:13px;margin:0 0 6px 6px}
.pill{display:flex;align-items:flex-end;gap:4px;background:var(--surface);border-radius:28px;padding:6px 8px;border:1px solid var(--border)}
.pill textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16.5px;resize:none;max-height:120px;padding:10px 4px}
.pill .ib{flex:none}
#send{background:var(--accent);color:#fff;font-size:18px}
#mic.on{background:#c4421a}
#imgm.on{background:var(--accent)}
#drawer{position:fixed;inset:0;z-index:40;pointer-events:none}
#drawer.open{pointer-events:auto}
#drawer .sc{position:absolute;inset:0;background:#0008;opacity:0;transition:.2s}
#drawer.open .sc{opacity:1}
#drawer .pn{position:absolute;top:0;bottom:0;left:0;width:86%;max-width:360px;background:var(--bg);transform:translateX(-100%);transition:.25s;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#drawer.open .pn{transform:none}
.dh{display:flex;align-items:center;gap:10px;padding:0 8px 12px}
.dh img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.dh b{flex:1;font-size:18px;font-weight:500}
.it{display:flex;align-items:center;gap:16px;width:100%;background:none;border:0;border-radius:24px;padding:13px 14px;font-size:17px;text-align:left}
.it.pr{background:var(--card)}
.it i{font-style:normal;width:26px;text-align:center;font-size:20px}
.sec{color:var(--muted);font-size:15px;padding:16px 14px 6px}
.lst{flex:1;overflow-y:auto}
.ch{display:flex;align-items:center}
.ch .it{flex:1;font-size:16px;padding:11px 14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.ch .x{background:none;border:0;color:var(--muted);font-size:16px;padding:8px}
.me2{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--border)}
.me2 .av{width:40px;height:40px}
.me2 b{flex:1;font-weight:500}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{display:flex}
.sh{display:flex;align-items:center;gap:8px;padding:10px 12px}
.sh h3{margin:0;font-size:19px;font-weight:500;flex:1}
#sh-b{flex:1;overflow-y:auto;padding:4px 16px 24px}
input,textarea.f,select{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;outline:0;margin:6px 0}
textarea.f{min-height:140px;resize:vertical}
label{font-size:13px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:11px 16px;margin:6px 6px 6px 0;font-size:15px}
.btn.g{background:var(--card);color:var(--text)}
.row{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin:8px 0;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.row small{display:block;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid img{width:100%;border-radius:14px;background:#fff;display:block}
.empty{color:var(--muted);text-align:center;padding:40px 0}
#login{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,var(--bg) 45%,var(--bg2));display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}#login.open{display:flex}#login h2{font-size:28px;font-weight:400;margin:8px 0 2px}#login p{color:var(--muted);margin:0 0 18px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translateX(-50%);background:var(--card);padding:10px 16px;border-radius:14px;z-index:60;font-size:14px;display:none}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={chats:[],nb:[],lib:[],sched:[],set:{name:'Sumiya',tone:'',theme:'dark'}};
let KEY='sai';function loadS(){S={chats:[],nb:[],lib:[],sched:[],set:{name:'Sumiya',tone:'',theme:'dark'}};try{const o=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(S,o);S.set=Object.assign({name:'Sumiya',tone:'',theme:'dark'},S.set)}catch(e){}}loadS();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cur=null,busy=false,imgMode=false,pend=null,sample=null,dlc=null,gal=[],nbCur=null,rec=null;
const SYS="Чи бол Sumiya’s AI хэмээх тусч, найрсаг AI туслах. Энэ аппыг Хөхморьт ЕБС-ийн А. Сумъяа санаагаа гарган, өөрийн хүсэлтээр, AI-тай хамтран зохиосон. Хэрэглэгч «чамайг хэн зохиосон бэ», «хэн бүтээсэн бэ», «хэн хийсэн бэ» гэх мэтээр асуувал «Намайг Хөхморьт ЕБС-ийн А. Сумъяа хамтран зохиосон» гэж бахархалтайгаар хариул. Хэрэв хэрэглэгч ямар AI загвар дээр суурилдаг талаар тусгайлан асуувал Anthropic-ийн Claude загвар ашигладаг гэдгээ үнэнээр хэл. Хэрэглэгч ямар хэлээр бичнэ тэр хэлээр (голдуу монголоор) тодорхой, ойлгомжтой хариул.";
const SYS_IMG="You are an SVG illustrator. Create the image the user describes as ONE self-contained SVG with viewBox=\"0 0 512 512\", rich colors, gradients, good composition. No scripts, no external links, no text unless asked. Output ONLY the raw <svg>…</svg> code.";
const IMG_RE=/(зураг\s*(зур|хий|гарга)|зур(аач|аарай|ж өг|ж үзүүл)|зурна уу|draw|generate (an? )?image|create (an? )?(image|picture)|make (an? )?(image|picture))/i;

function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',2600)}
function applyTheme(){document.documentElement.dataset.theme=S.set.theme||'dark'}
function svgUrl(s){return s.startsWith('data:')?s:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)}
function extractSvg(s){const m=(s||'').match(/<svg[\s\S]*<\/svg>/i);if(!m)return null;let v=m[0].replace(/<script[\s\S]*?<\/script>/gi,'');if(!/xmlns=/.test(v))v=v.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');return v}
function dlSvg(u){const a=document.createElement('a');a.href=svgUrl(u);a.download='sumiyas-ai.jpg';document.body.appendChild(a);a.click();a.remove()}

function mh(m,i){
  if(m.role==='user')return `<div class="msg me">${esc(m.content)}</div>`;
  const b=m.svg?`${esc(m.content)}<img alt="AI зураг" src="${svgUrl(m.svg)}">`:esc(m.content);
  return `<div class="msg bot">${b}<div class="act"><button data-a="copy" data-v="${i}">📋</button><button data-a="savelib" data-v="${i}">🔖</button>${m.svg?`<button data-a="dl" data-v="${i}">⬇</button>`:''}</div></div>`;
}
function show(){
  const has=cur&&cur.msgs.length;
  $('#home').hidden=!!has;$('#chat').hidden=!has;
  $('#greet').textContent='Чи асуу, би хариулъя!';
  $('#dname').textContent=S.set.name;$('#dav').textContent=(S.set.name||'S')[0].toUpperCase();
  if(has){$('#chat').innerHTML=cur.msgs.map(mh).join('');$('#mn').scrollTop=1e9}
  drawerList();
}
function drawerList(){
  $('#clist').innerHTML=S.chats.map(c=>`<div class="ch"><button class="it" data-a="open" data-v="${c.id}">${esc(c.title)}</button><button class="x" data-a="del" data-v="${c.id}">✕</button></div>`).join('')||'<div class="empty" style="padding:14px">Чат алга</div>';
}

let TOK=sessionStorage.getItem('sai_tok')||'';
function parseJwt(t){try{return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return null}}
function login(){$('#login').classList.add('open')}
function onCred(r){TOK=r.credential;sessionStorage.setItem('sai_tok',TOK);enter()}
function enter(){
  const p=parseJwt(TOK);if(!p||p.exp*1000<Date.now()){TOK='';return login()}
  const nk='sai:'+p.sub;
  if(nk!==KEY){KEY=nk;const first=!localStorage.getItem(KEY);loadS();if(first){S.set.name=p.given_name||p.name||S.set.name;save()}cur=null}
  $('#login').classList.remove('open');applyTheme();show();initG();
}
async function initG(){
  let c;try{c=await (await fetch('/api/config')).json()}catch(e){return toast('Серверт холбогдож чадсангүй')}
  const go=()=>{google.accounts.id.initialize({client_id:c.clientId,callback:onCred,auto_select:true});google.accounts.id.renderButton($('#gbtn'),{theme:'filled_blue',size:'large',text:'continue_with',shape:'pill'});if(parseJwt(TOK))enter();else login()};
  if(window.google&&google.accounts)go();else{const i=setInterval(()=>{if(window.google&&google.accounts){clearInterval(i);go()}},200)}
}
async function api(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOK},body:JSON.stringify(body)});
  if(r.status===401){login();throw {code:'auth'}}
  if(r.status===429)throw {code:'rate_limited'};
  if(!r.ok)throw {code:'err'};
  return r.json();
}
function shrink(src,max){return new Promise((ok,no)=>{const u=typeof src==='string'?src:URL.createObjectURL(src);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);if(typeof src!=='string')URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};im.onerror=no;im.src=u})}

async function ask(text){
  text=(text||'').trim();if(busy||!text)return;
  if(!TOK)return login();
  if(!cur){cur={id:String(Date.now()),title:text.slice(0,34),msgs:[]};S.chats.unshift(cur)}
  const img=pend;pend=null;$('#pv').hidden=true;
  const wantImg=!img&&(imgMode||IMG_RE.test(text));
  cur.msgs.push({role:'user',content:(img?'📎 ':'')+text});
  const bot={role:'assistant',content:wantImg?'🎨 Зурж байна…':'…'};cur.msgs.push(bot);
  show();busy=true;
  try{
    if(wantImg){
      const r=await api('/api/image',{prompt:text});
      bot.svg=await shrink('data:'+r.mime+';base64,'+r.data,640);bot.content='Энэ байна:';
    }else{
      let h=cur.msgs.slice(0,-1).map(m=>({role:m.role,content:m.svg?'[зураг: '+m.content+']':m.content}));
      while(h.length&&h[0].role!=='user')h.shift();
      const body={messages:h.slice(-14),tone:S.set.tone};
      if(img)body.image=await shrink(img,1024);
      const r=await api('/api/chat',body);bot.content=r.text||'…';
    }
  }catch(e){
    cur.msgs.splice(-2,2);
    toast(e&&e.code==='auth'?'Дахин нэвтэрнэ үү':e&&e.code==='rate_limited'?'Түр хүлээгээд дахин оролдоно уу':'Алдаа гарлаа, дахин оролдоно уу');
  }
  busy=false;if(!cur.msgs.length){S.chats=S.chats.filter(c=>c!==cur);cur=null}
  save();show();
}

const sheet=(t,b)=>{$('#sh-t').textContent=t;$('#sh-b').innerHTML=b;$('#sheet').classList.add('open');$('#drawer').classList.remove('open')};
const views={
 search(){sheet('Чат хайх','<input id="q" placeholder="Хайх…" autofocus><div id="qr"></div>');qs('')},
 sched(){
  const L=S.sched.slice().sort((a,b)=>a.at-b.at).map(s=>`<div class="row">${esc(s.prompt)}<small>${new Date(s.at).toLocaleString()} · ${s.done?'✅ биелсэн':'⏳ хүлээгдэж буй'} <button class="btn g" style="padding:3px 10px;margin:0 0 0 8px" data-a="sdel" data-v="${s.id}">Устгах</button></small></div>`).join('')||'<div class="empty">Хуваарьт даалгавар алга</div>';
  sheet('Хуваарьт',`<label>Хэзээ</label><input id="sat" type="datetime-local"><label>Юу асуух вэ</label><input id="sp" placeholder="Жишээ: Өдрийн сэтгэл хөдөлгөм үг хэл"><button class="btn" data-a="sadd">Нэмэх</button><div class="row" style="font-size:13px;color:var(--muted)">Цаг болоход апп нээлттэй байвал AI автоматаар хариулна.</div>${L}`)},
 custom(){sheet('Тохируулах',`<label>Таны нэр</label><input id="cn" value="${esc(S.set.name)}"><label>AI хэрхэн ярих вэ (заавал биш)</label><textarea class="f" id="ct" placeholder="Жишээ: Үргэлж товч, найз шиг ярь">${esc(S.set.tone)}</textarea><label>Загвар</label><select id="cth"><option value="dark">Бараан</option><option value="light">Цайвар</option><option value="auto">Системтэй адил</option></select><button class="btn" data-a="csave">Хадгалах</button><button class="btn g" data-a="logout">Гарах</button><button class="btn g" data-a="wipe">Өгөгдөл арилгах</button>`);$('#cth').value=S.set.theme},
 images(){
  gal=[];S.chats.forEach(c=>c.msgs.forEach(m=>{if(m.svg)gal.push(m.svg)}));
  sheet('Зургууд',gal.length?'<div class="grid">'+gal.map((s,i)=>`<img data-a="gdl" data-v="${i}" alt="" src="${svgUrl(s)}">`).join('')+'</div><p class="empty">Зураг дээр дарж хадгална</p>':'<div class="empty">Одоогоор зураг алга.<br>“Муур зур” гэж бичээд үзээрэй 🎨</div>')},
 lib(){sheet('Номын сан',S.lib.map((x,i)=>`<div class="row">${x.svg?`<img alt="" style="width:100%;border-radius:12px;background:#fff" src="${svgUrl(x.svg)}">`:esc(x.content)}<small><button class="btn g" style="padding:3px 10px;margin:0" data-a="ldel" data-v="${i}">Устгах</button></small></div>`).join('')||'<div class="empty">Хадгалсан зүйл алга.<br>Хариулт дээрх 🔖 товчоор хадгална</div>')},
 nb(){
  const L=S.nb.map(n=>`<button class="it" style="border:1px solid var(--border);margin:6px 0" data-a="nbo" data-v="${n.id}"><i>📓</i>${esc(n.title||'Нэргүй')}</button>`).join('');
  sheet('Дэвтэрүүд',`<button class="btn" data-a="nbnew">＋ Шинэ дэвтэр</button>${L}`)},
};
function qs(q){q=q.toLowerCase();const r=S.chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.msgs.some(m=>(m.content||'').toLowerCase().includes(q)));$('#qr').innerHTML=r.map(c=>`<button class="it" style="border-bottom:1px solid var(--border);border-radius:0" data-a="open" data-v="${c.id}">${esc(c.title)}</button>`).join('')||'<div class="empty">Олдсонгүй</div>'}
function nbEdit(n){nbCur=n;sheet('Дэвтэр',`<input id="nt" placeholder="Гарчиг" value="${esc(n.title)}"><textarea class="f" id="nx" style="min-height:260px" placeholder="Тэмдэглэлээ энд бич…">${esc(n.text)}</textarea><button class="btn" data-a="nbai">✨ AI дүгнэлт</button><button class="btn g" data-a="nbdel">Устгах</button>`)}

const acts={
 menu(){$('#drawer').classList.add('open')},
 close(){$('#drawer').classList.remove('open')},
 sclose(){$('#sheet').classList.remove('open');show()},
 new(){cur=null;imgMode=false;$('#imgm').classList.remove('on');acts.close();$('#sheet').classList.remove('open');show()},
 open(id){cur=S.chats.find(c=>c.id===id);acts.close();$('#sheet').classList.remove('open');show()},
 del(id){S.chats=S.chats.filter(c=>c.id!==id);if(cur&&cur.id===id)cur=null;save();show()},
 view(n){views[n]()},
 sug(v,b){ask(b.dataset.t)},
 send(){const t=$('#t');const v=t.value;t.value='';t.style.height='auto';ask(v)},
 attach(){$('#file').click()},
 unpin(){pend=null;$('#pv').hidden=true},
 imgm(){imgMode=!imgMode;$('#imgm').classList.toggle('on',imgMode);$('#t').placeholder=imgMode?'Ямар зураг зуулах вэ?':'Sumiya’s AI-аас асуух'},
 mic(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Таны төхөөрөмж дуу таниулахыг дэмжихгүй байна');
  if(rec){rec.stop();return}
  rec=new R();rec.lang='mn-MN';rec.interimResults=false;
  rec.onresult=e=>{$('#t').value=e.results[0][0].transcript};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('on')};rec.onerror=()=>toast('Дуу таниулж чадсангүй');
  $('#mic').classList.add('on');rec.start()},
 copy(i){try{navigator.clipboard.writeText(cur.msgs[i].content);toast('Хуулагдлаа')}catch(e){toast('Хуулж чадсангүй')}},
 savelib(i){const m=cur.msgs[i];S.lib.unshift({content:m.content,svg:m.svg||null});save();toast('Номын санд хадгаллаа')},
 dl(i){dlSvg(cur.msgs[i].svg)},
 gdl(i){dlSvg(gal[i])},
 ldel(i){S.lib.splice(+i,1);save();views.lib()},
 sadd(){const v=$('#sat').value,p=$('#sp').value.trim();if(!v||!p)return toast('Цаг болон асуултаа бөглөнө үү');S.sched.push({id:String(Date.now()),at:new Date(v).getTime(),prompt:p,done:false});save();views.sched()},
 sdel(id){S.sched=S.sched.filter(s=>s.id!==id);save();views.sched()},
 csave(){S.set.name=$('#cn').value.trim()||'Sumiya';S.set.tone=$('#ct').value.trim();S.set.theme=$('#cth').value;save();applyTheme();toast('Хадгаллаа');acts.sclose()},
 wipe(){if(confirm('Бүх чат, дэвтэр, тохиргоог арилгах уу?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}},
nbnew(){const n={id:String(Date.now()),title:'',text:''};S.nb.unshift(n);save();nbEdit(n)},
 nbo(id){nbEdit(S.nb.find(n=>n.id===id))},
 nbdel(){S.nb=S.nb.filter(n=>n!==nbCur);save();views.nb()},
 async nbai(){
  const n=nbCur;if(!n.text.trim())return toast('Эхлээд тэмдэглэл бичнэ үү');
  toast('Дүгнэж байна…');
  try{const r=await api('/api/chat',{messages:[{role:'user',content:'Доорх тэмдэглэлийг 3-5 өгүүлбэрээр дүгнэж, гол санааг гарга:\n\n'+n.text}]});n.text+='\n\n— AI дүгнэлт —\n'+r.text;save();nbEdit(n)}catch(e){toast('Алдаа гарлаа')}},
 logout(){TOK='';sessionStorage.removeItem('sai_tok');try{google.accounts.id.disableAutoSelect()}catch(e){}acts.sclose();login()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=acts[b.dataset.a];if(f)f(b.dataset.v,b)});
document.addEventListener('input',e=>{
  if(e.target.id==='q')qs(e.target.value);
  if(e.target.id==='nt'&&nbCur){nbCur.title=e.target.value;save()}
  if(e.target.id==='nx'&&nbCur){nbCur.text=e.target.value;save()}
  if(e.target.id==='t'){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'}
});
$('#t').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();acts.send()}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(f){pend=f;$('#pv').hidden=false;toast('Зураг хавсарлаа — асуултаа бичнэ үү')}e.target.value=''});
setInterval(()=>{if(busy)return;const d=S.sched.find(s=>!s.done&&s.at<=Date.now());if(d){d.done=true;save();cur=null;acts.close();$('#sheet').classList.remove('open');ask(d.prompt)}},15000);
applyTheme();show();
</script>
